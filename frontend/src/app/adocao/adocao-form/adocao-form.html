<div class="page-wrapper page-wrapper--narrow">
  <p-toast />
  <p-card>
    <ng-template #header>
      <div class="card-header">Confirmar Entrega de Animal</div>
    </ng-template>
    <form [formGroup]="form">
      <div class="form-row">
        <div class="form-field form-field--grow">
          <label>Solicitação Aprovada *</label>
          <p-select formControlName="solicitacaoId" [options]="solicitacoesOpcoes"
                    optionLabel="label" optionValue="value"
                    placeholder="Selecione a solicitação aprovada" [style]="{ width: '100%' }" />
          <small class="erro" *ngIf="temErro('solicitacaoId')">Solicitação é obrigatória.</small>
        </div>
      </div>
      <div class="form-row">
        <div class="form-field form-field--grow">
          <label>Confirmado por (ONG / Protetor) *</label>
          <p-select formControlName="confirmadoPorId" [options]="responsaveisOpcoes"
                    optionLabel="label" optionValue="value"
                    placeholder="Selecione o responsável" [style]="{ width: '100%' }" />
          <small class="erro" *ngIf="temErro('confirmadoPorId')">Responsável é obrigatório.</small>
        </div>
        <div class="form-field">
          <label>Data da Entrega *</label>
          <p-datepicker formControlName="dataAdocao" dateFormat="dd/mm/yy"
                        [showIcon]="true" placeholder="dd/mm/aaaa" />
          <small class="erro" *ngIf="temErro('dataAdocao')">Data é obrigatória.</small>
        </div>
      </div>
    </form>
    <ng-template #footer>
      <div class="form-actions">
        <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="cancelar()" />
        <p-button label="Confirmar Adoção" icon="pi pi-check-circle"
                  [loading]="salvando()" (onClick)="salvar()" />
      </div>
    </ng-template>
  </p-card>
</div>
