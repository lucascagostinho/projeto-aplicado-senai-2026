<div class="page-wrapper">
  <p-toast />

  <p-card>
    <ng-template #title>
      <div class="card-header">
        {{ editando ? 'Editar Animal' : 'Cadastrar Animal' }}
      </div>
    </ng-template>

    <form [formGroup]="form" (ngSubmit)="salvar()">

      <p-divider align="left"><span class="section-label">Identificação</span></p-divider>

      <div class="form-row">
        <div class="form-field">
          <label>Espécie *</label>
          <p-select formControlName="especie" [options]="especies" optionLabel="label" optionValue="value"
            placeholder="Selecione" [style]="{ width: '100%' }"
            [invalid]="temErro('especie')" />
          <small *ngIf="temErro('especie')" class="erro">Espécie é obrigatória</small>
        </div>

        <div class="form-field">
          <label>Raça</label>
          <input pInputText formControlName="raca" placeholder="Ex: Labrador" style="width: 100%" />
        </div>

        <div class="form-field">
          <label>Sexo *</label>
          <p-select formControlName="sexo" [options]="sexos" optionLabel="label" optionValue="value"
            placeholder="Selecione" [style]="{ width: '100%' }"
            [invalid]="temErro('sexo')" />
          <small *ngIf="temErro('sexo')" class="erro">Sexo é obrigatório</small>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>Faixa Etária *</label>
          <p-select formControlName="faixaEtaria" [options]="faixasEtarias" optionLabel="label" optionValue="value"
            placeholder="Selecione" [style]="{ width: '100%' }"
            [invalid]="temErro('faixaEtaria')" />
          <small *ngIf="temErro('faixaEtaria')" class="erro">Faixa etária é obrigatória</small>
        </div>

        <div class="form-field">
          <label>Porte *</label>
          <p-select formControlName="porte" [options]="portes" optionLabel="label" optionValue="value"
            placeholder="Selecione" [style]="{ width: '100%' }"
            [invalid]="temErro('porte')" />
          <small *ngIf="temErro('porte')" class="erro">Porte é obrigatório</small>
        </div>

        <div class="form-field">
          <label>Cor</label>
          <input pInputText formControlName="cor" placeholder="Ex: amarelo" style="width: 100%" />
        </div>
      </div>

      <p-divider align="left"><span class="section-label">Localização e Status</span></p-divider>

      <div class="form-row">
        <div class="form-field form-field--grow">
          <label>Cidade *</label>
          <input pInputText formControlName="cidade" placeholder="Ex: Florianópolis" style="width: 100%"
            [class.ng-invalid]="temErro('cidade')" [class.ng-dirty]="temErro('cidade')" />
          <small *ngIf="temErro('cidade')" class="erro">Cidade é obrigatória</small>
        </div>

        <div class="form-field form-field--uf">
          <label>UF *</label>
          <input pInputText formControlName="estado" placeholder="SC" maxlength="2" style="width: 100%; text-transform: uppercase"
            [class.ng-invalid]="temErro('estado')" [class.ng-dirty]="temErro('estado')" />
          <small *ngIf="temErro('estado')" class="erro">Obrigatório</small>
        </div>

        <div class="form-field">
          <label>Status</label>
          <p-select formControlName="status" [options]="statusOpcoes" optionLabel="label" optionValue="value"
            [style]="{ width: '100%' }" />
        </div>
      </div>

      <p-divider align="left"><span class="section-label">Saúde e Informações Adicionais</span></p-divider>

      <div class="form-row form-row--checks">
        <div class="check-field">
          <p-checkbox formControlName="castrado" [binary]="true" inputId="castrado" />
          <label for="castrado">Castrado</label>
        </div>
        <div class="check-field">
          <p-checkbox formControlName="vacinado" [binary]="true" inputId="vacinado" />
          <label for="vacinado">Vacinado</label>
        </div>
      </div>

      <div class="form-field" style="margin-top: 1rem">
        <label>URL da Foto</label>
        <input pInputText formControlName="foto" placeholder="https://..." style="width: 100%" />
      </div>

      <div class="form-field" style="margin-top: 1rem">
        <label>Características</label>
        <textarea pTextarea formControlName="caracteristicas" rows="4"
          placeholder="Descreva o temperamento e outras características do animal"
          style="width: 100%; resize: vertical"></textarea>
      </div>

      <p-divider />

      <div class="form-actions">
        <p-button label="Cancelar" icon="pi pi-times" severity="secondary" [outlined]="true"
          type="button" (onClick)="cancelar()" />
        <p-button [label]="editando ? 'Atualizar' : 'Cadastrar'" icon="pi pi-check"
          type="submit" [loading]="salvando()" />
      </div>

    </form>
  </p-card>
</div>
