<div class="page-wrapper page-wrapper--narrow">
  <p-toast />

  <p-card>
    <ng-template #header>
      <div class="card-header">{{ editando ? 'Editar ONG' : 'Cadastrar ONG' }}</div>
    </ng-template>

    <form [formGroup]="form">
      <p-divider align="left"><span class="section-label">Dados da Organização</span></p-divider>
      <div class="form-row">
        <div class="form-field form-field--grow">
          <label>Razão Social *</label>
          <input pInputText formControlName="razaoSocial" placeholder="Nome da organização" style="width:100%" />
          <small class="erro" *ngIf="temErro('razaoSocial')">Razão Social é obrigatória.</small>
        </div>
        <div class="form-field">
          <label>CNPJ</label>
          <input pInputText formControlName="cnpj" placeholder="00.000.000/0000-00" style="width:100%" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-field form-field--grow">
          <label>Descrição</label>
          <textarea pTextarea formControlName="descricao" rows="3"
                    placeholder="Missão e atuação da ONG" style="width:100%"></textarea>
        </div>
      </div>

      <p-divider align="left"><span class="section-label">Acesso e Contato</span></p-divider>
      <div class="form-row">
        <div class="form-field form-field--grow">
          <label>E-mail *</label>
          <input pInputText formControlName="email" placeholder="contato@ong.org" style="width:100%" />
          <small class="erro" *ngIf="temErro('email')">E-mail válido é obrigatório.</small>
        </div>
        <div class="form-field">
          <label>Senha *</label>
          <input pInputText type="password" formControlName="senha" placeholder="••••••••" style="width:100%" />
          <small class="erro" *ngIf="temErro('senha')">Senha é obrigatória.</small>
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>Telefone</label>
          <input pInputText formControlName="telefone" placeholder="(48) 99999-0000" style="width:100%" />
        </div>
        <div class="form-field">
          <label>CEP</label>
          <input pInputText formControlName="cep" placeholder="88000-000" style="width:100%" />
        </div>
      </div>
    </form>

    <ng-template #footer>
      <div class="form-actions">
        <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="cancelar()" />
        <p-button [label]="editando ? 'Atualizar' : 'Cadastrar'" icon="pi pi-check"
                  [loading]="salvando()" (onClick)="salvar()" />
      </div>
    </ng-template>
  </p-card>
</div>
